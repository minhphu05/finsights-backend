image:
  registry: ghcr.io/minhphu05/finsights-backend
  imageTag: sha-36ae6015c29893402b7cc0ddc5ac7afbbfe3a17d
  pullPolicy: IfNotPresent
  pullSecrets: []

secretName: finsights-backend-secrets

config:
  corsAllowedOrigins: "*"
  googleOAuthClientId: "1023695913206-ls0utf87gs2a0n4cenc157ia4uho4fep.apps.googleusercontent.com"
  jwtIssuer: finsights-auth
  jwtAccessTtl: 15m
  mysqlTlsServerName: MySQL_Endpoint_Server
  mysqlMaxOpenConns: "5"
  mysqlMaxIdleConns: "2"
  rabbitmqExchange: finsights.events
  rabbitmqUserQueue: user.account-created

services:
  api-gateway:
    enabled: true
    replicas: 1
    servicePort: 8080
    containerPorts:
      - name: http
        containerPort: 8080
    env:
      - name: GATEWAY_HTTP_ADDR
        value: ":8080"
      - name: AUTH_SERVICE_ADDR
        value: finsights-backend-auth-service:9091
      - name: USER_SERVICE_ADDR
        value: finsights-backend-user-service:9092
      - name: MARKET_SERVICE_ADDR
        value: finsights-backend-market-service:9093
      - name: AI_SERVICE_ADDR
        value: finsights-backend-ai-service:9094
      - name: AI_HTTP_SERVICE_ADDR
        value: http://finsights-backend-ai-service:8081
    secretEnv:
      - name: JWT_SIGNING_KEY
        key: JWT_SIGNING_KEY
    probe:
      type: http
      port: http
      path: /livez
      readinessPath: /readyz
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi

  auth-service:
    enabled: true
    replicas: 1
    servicePort: 9091
    mysqlNode2: true
    containerPorts:
      - name: grpc
        containerPort: 9091
    env:
      - name: AUTH_GRPC_ADDR
        value: ":9091"
    secretEnv:
      - name: AUTH_MYSQL_DSN
        key: AUTH_MYSQL_DSN
      - name: JWT_SIGNING_KEY
        key: JWT_SIGNING_KEY
      - name: RABBITMQ_URL
        key: RABBITMQ_URL
      - name: ADMIN_BOOTSTRAP_USERNAME
        key: ADMIN_BOOTSTRAP_USERNAME
        optional: true
      - name: ADMIN_BOOTSTRAP_PASSWORD
        key: ADMIN_BOOTSTRAP_PASSWORD
        optional: true
    probe:
      type: tcp
      port: grpc
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi

  user-service:
    enabled: true
    replicas: 1
    servicePort: 9092
    mysqlNode2: true
    containerPorts:
      - name: grpc
        containerPort: 9092
    env:
      - name: USER_GRPC_ADDR
        value: ":9092"
    secretEnv:
      - name: USER_MYSQL_DSN
        key: USER_MYSQL_DSN
      - name: JWT_SIGNING_KEY
        key: JWT_SIGNING_KEY
      - name: RABBITMQ_URL
        key: RABBITMQ_URL
    probe:
      type: tcp
      port: grpc
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi

  market-service:
    enabled: true
    replicas: 1
    servicePort: 9093
    mysqlNode2: true
    containerPorts:
      - name: grpc
        containerPort: 9093
    env:
      - name: MARKET_GRPC_ADDR
        value: ":9093"
    secretEnv:
      - name: MARKET_DATA_MYSQL_DSN
        key: MARKET_DATA_MYSQL_DSN
      - name: NEWS_MYSQL_DSN
        key: NEWS_MYSQL_DSN
      - name: FUNDAMENTALS_MYSQL_DSN
        key: FUNDAMENTALS_MYSQL_DSN
      - name: DISCLOSURES_MYSQL_DSN
        key: DISCLOSURES_MYSQL_DSN
    probe:
      type: tcp
      port: grpc
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi

  ai-service:
    enabled: true
    # AI provider setup is intentionally out of scope; healthz checks the service process.
    imageTag: sha-8b2c7ad5fe8a300080d90eee85abee9a906f9099
    replicas: 1
    servicePort: 9094
    mysql: true
    oracleWalletSecretName: finsights-ai-oracle-wallet
    additionalServicePorts:
      - name: http
        port: 8081
        targetPort: http
    containerPorts:
      - name: grpc
        containerPort: 9094
      - name: http
        containerPort: 8081
    env:
      - name: AI_GRPC_ADDR
        value: 0.0.0.0:9094
      - name: AI_LLM_BASE_URL
        value: https://api.deepseek.com
      - name: AI_LLM_MODEL
        value: deepseek-flash
      - name: AI_MAX_HISTORY_MESSAGES
        value: "12"
      - name: AI_MAX_TOOL_ROUNDS
        value: "3"
      - name: AI_MAX_TOOL_CALLS
        value: "5"
      - name: AI_MAX_REQUESTS_PER_MINUTE
        value: "10"
      - name: AI_MAX_CONCURRENT_TURNS
        value: "2"
      - name: AI_MAX_OUTPUT_TOKENS
        value: "700"
      - name: AI_LLM_TIMEOUT_SECONDS
        value: "20"
      - name: AI_TURN_TIMEOUT_SECONDS
        value: "50"
      - name: AI_MARKET_SERVICE_ADDR
        value: finsights-backend-market-service:9093
      - name: AI_USER_SERVICE_ADDR
        value: finsights-backend-user-service:9092
      - name: AI_MYSQL_HOST
        value: 161.33.181.173
      - name: AI_MYSQL_PORT
        value: "3306"
      - name: AI_MYSQL_DATABASE
        value: finsights_ai
      - name: AI_MYSQL_USER
        value: finsights_ai_app
      - name: AI_MYSQL_TLS_CA_FILE
        value: /etc/finsights/mysql/ca.pem
      - name: AI_MYSQL_TLS_VERIFY_IDENTITY
        value: "false"
      - name: AI_MYSQL_POOL_SIZE
        value: "2"
      - name: AI_RAG_ENABLED
        value: "false"
      - name: AI_VECTOR_DIMENSIONS
        value: "1024"
      - name: AI_ORACLE_WALLET_DIR
        value: /etc/finsights/oracle-wallet
      - name: AI_VOYAGE_API_URL
        value: https://api.voyageai.com/v1/embeddings
      - name: AI_VOYAGE_MODEL
        value: voyage-4-lite
    secretEnv:
      - name: JWT_SIGNING_KEY
        key: JWT_SIGNING_KEY
      - name: AI_MYSQL_PASSWORD
        key: AI_MYSQL_PASSWORD
        optional: true
      - name: AI_LLM_API_KEY
        key: AI_LLM_API_KEY
        optional: true
      - name: AI_ORACLE_DSN
        key: AI_ORACLE_DSN
        optional: true
      - name: AI_ORACLE_USER
        key: AI_ORACLE_USER
        optional: true
      - name: AI_ORACLE_PASSWORD
        key: AI_ORACLE_PASSWORD
        optional: true
      - name: AI_ORACLE_WALLET_PASSWORD
        key: AI_ORACLE_WALLET_PASSWORD
        optional: true
      - name: VOYAGE_API_KEY
        key: VOYAGE_API_KEY
        optional: true
    probe:
      type: http
      port: http
      path: /healthz
      readinessPath: /healthz
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

ingress:
  enabled: true
  className: nginx
  host: finsights-prod-node-01.tail73ddb8.ts.net
  path: /
  pathType: Prefix
  annotations: {}
  tls:
    enabled: false
    secretName: ""
