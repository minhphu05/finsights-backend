{{- $root := . -}}
{{- $fullname := include "finsights-backend.fullname" . -}}
{{- range $name, $service := .Values.services }}
{{- if $service.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-%s" $fullname $name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "finsights-backend.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $service.replicas }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- with $root.Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ printf "%s/%s:%s" $root.Values.image.registry $name ($service.imageTag | default $root.Values.image.imageTag) | quote }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            {{- toYaml $service.containerPorts | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ $fullname }}-config
          {{- with $service.env }}
          env:
            {{- toYaml . | nindent 12 }}
            {{- range $service.secretEnv }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.secretName }}
                  key: {{ .key }}
                  optional: {{ .optional | default false }}
            {{- end }}
          {{- else }}
          {{- with $service.secretEnv }}
          env:
            {{- range . }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.secretName }}
                  key: {{ .key }}
                  optional: {{ .optional | default false }}
            {{- end }}
          {{- end }}
          {{- end }}
          {{- if or $service.mysql $service.mysqlNode2 $service.oracleWalletSecretName }}
          volumeMounts:
            {{- if $service.mysql }}
            - name: mysql-ca
              mountPath: /etc/finsights/mysql
              readOnly: true
            {{- end }}
            {{- if $service.mysqlNode2 }}
            - name: mysql-node-2-ca
              mountPath: /etc/finsights/mysql-node-2
              readOnly: true
            {{- end }}
            {{- if $service.oracleWalletSecretName }}
            - name: oracle-wallet
              mountPath: /etc/finsights/oracle-wallet
              readOnly: true
            {{- end }}
          {{- end }}
          {{- if eq $service.probe.type "http" }}
          startupProbe:
            httpGet:
              path: {{ $service.probe.path }}
              port: {{ $service.probe.port }}
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: {{ $service.probe.path }}
              port: {{ $service.probe.port }}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ $service.probe.readinessPath }}
              port: {{ $service.probe.port }}
            periodSeconds: 5
            failureThreshold: 3
          {{- else }}
          startupProbe:
            tcpSocket:
              port: {{ $service.probe.port }}
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            tcpSocket:
              port: {{ $service.probe.port }}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: {{ $service.probe.port }}
            periodSeconds: 5
            failureThreshold: 3
          {{- end }}
          resources:
            {{- toYaml $service.resources | nindent 12 }}
      {{- if or $service.mysql $service.mysqlNode2 $service.oracleWalletSecretName }}
      volumes:
        {{- if $service.mysql }}
        - name: mysql-ca
          configMap:
            name: {{ $fullname }}-mysql-ca
            items:
              - key: ca.pem
                path: ca.pem
        {{- end }}
        {{- if $service.mysqlNode2 }}
        - name: mysql-node-2-ca
          configMap:
            name: {{ $fullname }}-mysql-node-2-ca
            items:
              - key: ca.pem
                path: ca.pem
        {{- end }}
        {{- if $service.oracleWalletSecretName }}
        - name: oracle-wallet
          secret:
            secretName: {{ $service.oracleWalletSecretName | quote }}
            optional: true
        {{- end }}
      {{- end }}
{{- end }}
{{- end }}
