apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "finsights-backend.fullname" . }}-config
  labels:
    {{- include "finsights-backend.labels" . | nindent 4 }}
data:
  JWT_ISSUER: {{ .Values.config.jwtIssuer | quote }}
  JWT_ACCESS_TTL: {{ .Values.config.jwtAccessTtl | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
  MYSQL_TLS_CA_FILE: /etc/finsights/mysql/ca.pem
  MYSQL_TLS_SERVER_NAME: {{ .Values.config.mysqlTlsServerName | quote }}
  MYSQL_MAX_OPEN_CONNS: {{ .Values.config.mysqlMaxOpenConns | quote }}
  MYSQL_MAX_IDLE_CONNS: {{ .Values.config.mysqlMaxIdleConns | quote }}
  RABBITMQ_EXCHANGE: {{ .Values.config.rabbitmqExchange | quote }}
  RABBITMQ_USER_QUEUE: {{ .Values.config.rabbitmqUserQueue | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "finsights-backend.fullname" . }}-mysql-ca
  labels:
    {{- include "finsights-backend.labels" . | nindent 4 }}
data:
  ca.pem: |-
{{ .Files.Get "files/mysql-node-1-ca.pem" | indent 4 }}
