name: Build and deploy backend

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'cmd/**'
      - 'internal/**'
      - 'proto/**'
      - 'services/**'
      - 'Dockerfile.go'
      - '.dockerignore'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'cmd/**'
      - 'internal/**'
      - 'proto/**'
      - 'services/**'
      - 'Dockerfile.go'
      - '.dockerignore'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finsights-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api-gateway
            dockerfile: Dockerfile.go
            build_arg: api-gateway
          - image: auth-service
            dockerfile: Dockerfile.go
            build_arg: auth-service
          - image: user-service
            dockerfile: Dockerfile.go
            build_arg: user-service
          - image: market-service
            dockerfile: Dockerfile.go
            build_arg: market-service
          - image: ai-service
            dockerfile: services/ai/Dockerfile
            build_arg: ''
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}/${{ matrix.image }}:sha-${{ github.sha }}
          build-args: |
            APP=${{ matrix.build_arg }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  update-gitops:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Update Helm image tag
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          sed -i.bak -E "s/^  imageTag: .*/  imageTag: ${IMAGE_TAG}/" deploy/helm/values.yaml
          rm -f deploy/helm/values.yaml.bak
          if git diff --quiet -- deploy/helm/values.yaml; then
            echo "Helm values already reference ${IMAGE_TAG}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/helm/values.yaml
          git commit -m "chore(deploy): use images ${IMAGE_TAG}"
          git push origin "HEAD:${{ github.ref_name }}"
